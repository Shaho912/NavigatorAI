<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Navigator AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:            #0d0d14;
      --bg-end:        #12121e;
      --surface:       #161622;
      --surface-alt:   #1a1a28;
      --border:        #23233a;
      --border-soft:   #1e1e30;
      --text:          #e8e8f2;
      --text-secondary:#a0a0bc;
      --muted:         #5a5a7a;
      --accent-blue:   #4F8EF7;
      --accent-purple: #6C63FF;
      --accent-line:   linear-gradient(90deg, #4F8EF7, #6C63FF, #a855f7);
      --mic-gradient:  linear-gradient(135deg, #6C63FF 0%, #4F8EF7 100%);
      --mic-glow:      rgba(79, 142, 247, 0.35);
      --mic-glow-hot:  rgba(108, 99, 255, 0.55);
      --green:         #00C896;
      --green-glow:    rgba(0, 200, 150, 0.3);
      --red:           #FF5C5C;
      --red-glow:      rgba(255, 92, 92, 0.3);
      --bubble-nav:    #1c1c2e;
      --bubble-you:    #1e1a36;
      --avatar-nav:    #4F8EF7;
      --avatar-you:    #6C63FF;
    }

    html, body {
      height: 100%;
      background: linear-gradient(160deg, var(--bg) 0%, var(--bg-end) 100%);
      color: var(--text);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Top accent line ── */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--accent-line);
      z-index: 100;
    }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 288px 1fr;
      grid-template-rows: 68px 1fr;
      height: 100vh;
    }

    /* ── Header ── */
    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 28px;
      border-bottom: 1px solid var(--border);
      background: rgba(22, 22, 34, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      margin-top: 2px; /* clear accent line */
    }

    /* Logo mark */
    .logo-mark {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(135deg, #6C63FF22, #4F8EF722);
      border: 1px solid #4F8EF730;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .wordmark {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: var(--text);
      line-height: 1;
    }

    .wordmark .ai {
      color: var(--accent-blue);
      font-weight: 700;
    }

    .header-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }

    #user-name {
      margin-left: auto;
      font-size: 12px;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.01em;
    }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      background: var(--surface);
      padding: 28px 20px;
      display: flex;
      flex-direction: column;
      gap: 32px;
      position: relative;
    }

    /* subtle inner glow on sidebar right edge */
    aside::after {
      content: "";
      position: absolute;
      top: 0; right: -1px; bottom: 0;
      width: 1px;
      background: linear-gradient(180deg, transparent, #4F8EF715 30%, #4F8EF715 70%, transparent);
      pointer-events: none;
    }

    .section-title {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-blue);
      margin-bottom: 14px;
      opacity: 0.8;
    }

    /* ── Mic button ── */
    .mic-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding-top: 8px;
    }

    .mic-outer {
      position: relative;
      width: 100px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* glow ring behind button */
    .mic-glow-ring {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: transparent;
      box-shadow: 0 0 24px 6px var(--mic-glow);
      animation: glow-pulse 3s ease-in-out infinite;
    }

    .mic-outer.active .mic-glow-ring {
      box-shadow: 0 0 36px 12px var(--mic-glow-hot);
      animation: glow-pulse-hot 1.2s ease-in-out infinite;
    }

    @keyframes glow-pulse {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1;   }
    }

    @keyframes glow-pulse-hot {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }

    .mic-btn {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: none;
      background: var(--mic-gradient);
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      box-shadow:
        0 8px 32px rgba(108, 99, 255, 0.4),
        0 2px 8px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.08);
      transition: box-shadow 0.3s ease;
    }

    .mic-outer.active .mic-btn {
      box-shadow:
        0 8px 40px rgba(79, 142, 247, 0.6),
        0 2px 8px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .mic-btn svg { width: 38px; height: 38px; fill: #fff; position: relative; z-index: 1; }

    /* expand rings */
    .mic-btn::before,
    .mic-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent-purple);
      opacity: 0;
      animation: ring-expand 3s ease-out infinite;
    }
    .mic-btn::after { animation-delay: 1.5s; }

    .mic-outer.active .mic-btn::before,
    .mic-outer.active .mic-btn::after {
      animation-duration: 1.1s;
      background: var(--accent-blue);
    }

    @keyframes ring-expand {
      0%   { transform: scale(1);    opacity: 0.5; }
      100% { transform: scale(2.0);  opacity: 0; }
    }

    .mic-status {
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      text-align: center;
      letter-spacing: 0.03em;
      transition: color 0.3s;
    }

    .mic-outer.active ~ .mic-status {
      color: var(--accent-blue);
    }

    /* ── Connector list ── */
    .connector-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .connector-row {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 400;
      color: var(--text-secondary);
      padding: 7px 10px;
      border-radius: 8px;
      cursor: default;
      transition: background 0.15s, color 0.15s;
    }

    .connector-row:hover {
      background: rgba(79, 142, 247, 0.06);
      color: var(--text);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
      background: var(--border);
      transition: background 0.4s, box-shadow 0.4s;
    }

    .dot.connected {
      background: var(--green);
      box-shadow: 0 0 8px var(--green-glow), 0 0 3px var(--green);
    }

    .dot.disconnected {
      background: var(--red);
      box-shadow: 0 0 8px var(--red-glow), 0 0 3px var(--red);
    }

    /* ── Main transcript panel ── */
    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-left: 2px solid var(--accent-blue);
      border-left-color: rgba(79, 142, 247, 0.18);
    }

    .transcript-header {
      padding: 18px 28px 14px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(13, 13, 20, 0.4);
    }

    .transcript-header h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text-secondary);
    }

    /* pulsing LIVE badge */
    .live-badge {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--green);
      background: rgba(0, 200, 150, 0.1);
      border: 1px solid rgba(0, 200, 150, 0.25);
      padding: 2px 9px;
      border-radius: 20px;
      animation: live-pulse 2s ease-in-out infinite;
    }

    @keyframes live-pulse {
      0%, 100% { opacity: 0.7; }
      50%       { opacity: 1; box-shadow: 0 0 10px rgba(0, 200, 150, 0.3); }
    }

    #transcript {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #transcript::-webkit-scrollbar       { width: 4px; }
    #transcript::-webkit-scrollbar-track { background: transparent; }
    #transcript::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ── Message rows ── */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 720px;
      animation: msg-in 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes msg-in {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.you {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.nav {
      align-self: flex-start;
    }

    /* avatar dot */
    .msg-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0;
      margin-top: 2px;
    }

    .msg.nav .msg-avatar {
      background: rgba(79, 142, 247, 0.15);
      border: 1px solid rgba(79, 142, 247, 0.3);
      color: var(--avatar-nav);
    }

    .msg.you .msg-avatar {
      background: rgba(108, 99, 255, 0.15);
      border: 1px solid rgba(108, 99, 255, 0.3);
      color: var(--avatar-you);
    }

    .msg-body {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .msg-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .msg.nav .msg-label { color: rgba(79, 142, 247, 0.7); }
    .msg.you .msg-label {
      color: rgba(108, 99, 255, 0.7);
      text-align: right;
    }

    .msg-bubble {
      padding: 11px 15px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      font-weight: 400;
    }

    .msg.nav .msg-bubble {
      background: var(--bubble-nav);
      border: 1px solid rgba(79, 142, 247, 0.08);
      border-bottom-left-radius: 4px;
      color: var(--text);
    }

    .msg.you .msg-bubble {
      background: var(--bubble-you);
      border: 1px solid rgba(108, 99, 255, 0.12);
      border-bottom-right-radius: 4px;
      color: var(--text);
    }

    /* ── Empty state ── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      color: var(--muted);
      gap: 14px;
      font-size: 14px;
      font-weight: 400;
      opacity: 0.5;
    }

    .empty-state svg { width: 44px; height: 44px; opacity: 0.35; }

    .empty-state p {
      font-size: 13px;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>

<div class="layout">

  <!-- Header -->
  <header>
    <div class="logo-mark">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="9" cy="9" r="4" fill="none" stroke="#4F8EF7" stroke-width="1.5"/>
        <circle cx="9" cy="9" r="1.5" fill="#4F8EF7"/>
        <path d="M9 2v2M9 14v2M2 9h2M14 9h2" stroke="#4F8EF7" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="wordmark">Navigator <span class="ai">AI</span></span>
    <div class="header-divider"></div>
    <span id="user-name"></span>
  </header>

  <!-- Sidebar -->
  <aside>

    <!-- Mic -->
    <div class="mic-wrap">
      <div class="mic-outer" id="mic-outer">
        <div class="mic-glow-ring"></div>
        <button class="mic-btn" tabindex="-1" title="Voice active">
          <svg viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm-1 17.93V21H9v2h6v-2h-2v-2.07A8.001 8.001 0 0 0 20 11h-2a6 6 0 0 1-12 0H4a8.001 8.001 0 0 0 7 7.93z"/></svg>
        </button>
      </div>
      <p class="mic-status" id="mic-status">Ready</p>
    </div>

    <!-- Connections -->
    <div>
      <p class="section-title">Connections</p>
      <div class="connector-list">
        <div class="connector-row"><span class="dot" id="dot-Gmail"></span>Gmail</div>
        <div class="connector-row"><span class="dot" id="dot-Google Drive"></span>Google Drive</div>
        <div class="connector-row"><span class="dot" id="dot-Google Calendar"></span>Calendar</div>
        <div class="connector-row"><span class="dot" id="dot-Messages"></span>Messages</div>
        <div class="connector-row"><span class="dot" id="dot-Phone"></span>Phone</div>
      </div>
    </div>

  </aside>

  <!-- Transcript -->
  <main>
    <div class="transcript-header">
      <h2>Session Transcript</h2>
      <span class="live-badge">LIVE</span>
    </div>
    <div id="transcript">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
          <path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.97-4.03 9-9 9a9.02 9.02 0 0 1-4.5-1.2L3 21l1.2-4.5A9.02 9.02 0 0 1 3 12C3 7.03 7.03 3 12 3s9 4.03 9 9z" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Waiting for conversation to begin…</p>
      </div>
    </div>
  </main>

</div>

<script>
  const POLL_MS = 1000;
  let lastLogLen  = 0;
  let lastActivity = Date.now();

  // ── Status ──────────────────────────────────────────────────────────────────
  async function fetchStatus() {
    try {
      const r = await fetch('/status');
      if (!r.ok) return;
      const data = await r.json();

      const nameEl = document.getElementById('user-name');
      nameEl.textContent = data.name ? `Logged in as ${data.name}` : '';

      for (const [name, connected] of Object.entries(data.connectors)) {
        const dot = document.getElementById('dot-' + name);
        if (dot) {
          dot.className = 'dot ' + (connected ? 'connected' : 'disconnected');
          dot.title     = name + (connected ? ': connected' : ': not connected');
        }
      }
    } catch (_) {}
  }

  // ── Transcript ───────────────────────────────────────────────────────────────
  async function fetchTranscript() {
    try {
      const r = await fetch('/transcript');
      if (!r.ok) return;
      const data = await r.json();
      const log  = data.log || [];

      if (log.length === lastLogLen) return;
      lastLogLen   = log.length;
      lastActivity = Date.now();

      const container  = document.getElementById('transcript');
      const emptyState = document.getElementById('empty-state');
      if (log.length > 0 && emptyState) emptyState.remove();

      container.querySelectorAll('.msg').forEach(el => el.remove());

      for (const entry of log) {
        const isYou  = entry.role === 'user';
        const cls    = isYou ? 'you' : 'nav';
        const label  = isYou ? 'You' : 'Navigator AI';
        const avatar = isYou ? 'U' : 'N';

        const msg = document.createElement('div');
        msg.className = 'msg ' + cls;
        msg.innerHTML = `
          <div class="msg-avatar">${avatar}</div>
          <div class="msg-body">
            <span class="msg-label">${label}</span>
            <div class="msg-bubble">${escapeHtml(entry.content)}</div>
          </div>
        `;
        container.appendChild(msg);
      }

      container.scrollTop = container.scrollHeight;
    } catch (_) {}
  }

  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Mic state ────────────────────────────────────────────────────────────────
  function updateMic() {
    const active   = Date.now() - lastActivity < 4000;
    const outer    = document.getElementById('mic-outer');
    const status   = document.getElementById('mic-status');
    const isActive = outer.classList.contains('active');

    if (active && !isActive) {
      outer.classList.add('active');
      status.textContent = 'Listening…';
      status.style.color = 'var(--accent-blue)';
    } else if (!active && isActive) {
      outer.classList.remove('active');
      status.textContent = 'Ready';
      status.style.color = '';
    }
  }

  // ── Init ─────────────────────────────────────────────────────────────────────
  (async function init() {
    await fetchStatus();
    await fetchTranscript();

    setInterval(async () => {
      await fetchTranscript();
      updateMic();
    }, POLL_MS);

    setInterval(fetchStatus,  5000);
    setInterval(updateMic,    1000);
  })();
</script>

</body>
</html>
